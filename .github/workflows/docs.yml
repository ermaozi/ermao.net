name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check connection tools and regression contracts
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm test:data
          python3 scripts/seo-regression.test.py
      - name: Build VuePress site
        run: pnpm build
      - name: Install Chromium for comparison-page checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Check airport summaries at desktop and phone widths
        run: node scripts/airport-summary-browser.cjs
      - name: Preserve comparison-page browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airport-summary-${{ github.sha }}
          path: artifacts/airport-summary
          if-no-files-found: warn
          retention-days: 3
      - name: Audit site content and generated homepage
        run: |
          pnpm run audit:site
          python3 scripts/seo-regression.py
      - name: Preserve verified build for deployment
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: docs/.vuepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  deploy:
    concurrency:
      group: ermao-net-production
      cancel-in-progress: false
    needs: docs
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve this commit's verified build
        uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: docs/.vuepress/dist
      - name: Reject an outdated release before deployment
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: 'main'
            });
            if (branch.data.commit.sha !== context.sha) {
              core.setFailed('main has advanced; refusing to publish an outdated build');
            }
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          keep_history: true
          jekyll: false
          build_dir: docs/.vuepress/dist
          fqdn: www.ermao.net
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      - name: Verify new release files through fresh CDN query keys
        run: python3 scripts/seo-regression.py --live
      - name: Check unparameterized public URL cache propagation
        shell: bash
        run: |
          set +e
          python3 scripts/seo-regression.py --canonical-status | tee /tmp/canonical-status.log
          status=${PIPESTATUS[0]}
          set -e
          cat /tmp/canonical-status.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 2 ]; then
            echo "::warning::Release files verified; public URL cache propagation remains pending. Follow the per-route status in the job summary."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - name: Record production HTTP diagnostics
        if: always()
        run: python3 scripts/seo-regression.py --http-audit

  production-http-audit:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect production routing and cache responses
        run: python3 scripts/seo-regression.py --http-audit

